<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Thi Trắc Nghiệm</title>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/home.css?v=4">
    <link rel="stylesheet" href="/static/css/sidebar.css?v=4">
    <link rel="stylesheet" href="/static/css/topbar.css?v=4">
    <link rel="stylesheet" href="/static/css/footer.css?v=4">

</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        {% include 'sidebar.html' %}

        <!-- MAIN -->
        <div class="main">

            <!-- TOPBAR -->
            {% include 'topbar.html' %}

            <!-- CONTENT -->
            <section class="content" id="mainContent">

                <!-- WELCOME DASHBOARD -->
                <div id="welcomeScreen" style="text-align: center; padding: 50px 20px; color: #6b7280;">
                    <h2 style="font-size: 24px; color: #1e293b; margin-bottom: 10px;">Chào mừng đến với Hệ thống</h2>
                    <p>Vui lòng chọn một chức năng từ menu bên trái để bắt đầu.</p>
                </div>

            </section>

            <!-- FOOTER -->
            {% include 'footer.html' %}

        </div>

    </div>

    <!-- SCRIPT -->
    <script>

        /* ================= AUTH ================= */

        (function () {

            const authArea =
                document.getElementById('authArea');

            const userJson =
                localStorage.getItem('user');

            function createUserBoxHtml(initials) {

                return `
                    <button id="avatarBtn" class="avatar">
                        ${initials}
                    </button>

                    <button id="logoutBtn" class="btn-logout">
                        Đăng xuất
                    </button>
                `;
            }

            if (!userJson) {

                authArea.innerHTML =
                    `
                    <a class="btn btn-outline"
                       href="/user/login">
                        Đăng nhập
                    </a>

                    <a class="btn btn-primary"
                       href="/user/register">
                        Đăng ký
                    </a>
                    `;

            } else {

                let user = null;

                try {

                    user = JSON.parse(userJson);

                } catch (e) { }

                const initials =
                    (user?.ten || 'U')
                        .charAt(0)
                        .toUpperCase();

                authArea.innerHTML =
                    createUserBoxHtml(initials);

                /* AVATAR */

                document
                    .getElementById('avatarBtn')
                    .onclick = () => {

                        window.location.href =
                            '/user/info';
                    };

                /* LOGOUT */

                document
                    .getElementById('logoutBtn')
                    .onclick = async () => {

                        try {

                            await fetch('/user/logout');

                        } catch (e) { }

                        localStorage.removeItem('user');

                        window.location.href =
                            '/user/login';
                    };
            }

        })();




        /* ================= LOAD MODULE ================= */

        (function () {

            const menuLinks =
                document.querySelectorAll('.menu a[data-module]');

            const mainContent =
                document.getElementById('mainContent');

            /* ROUTES */

            const moduleRoutes = {

                'monhoc': '/monhoc',

                'lop': '/lop/form',

                'giaovien': '/giaovien/form',

                'sinhvien': '/sinhvien/form',

                'bode': '/bode/form',

                'dangkythi': '/dangkythi/form',

                'thi': '/thi/form'
            };



            /* CLICK SIDEBAR LINK */

            menuLinks.forEach(link => {

                link.addEventListener(
                    'click',
                    async (e) => {

                        e.preventDefault();

                        // Cập nhật trạng thái active trên sidebar
                        menuLinks.forEach(l => l.classList.remove('active'));
                        link.classList.add('active');

                        const module =
                            link.dataset.module;

                        // Nếu là dashboard thì hiện lại màn hình chào mừng
                        if (module === 'dashboard') {
                            mainContent.innerHTML = `
                                <div id="welcomeScreen" style="text-align: center; padding: 50px 20px; color: #6b7280;">
                                    <h2 style="font-size: 24px; color: #1e293b; margin-bottom: 10px;">Chào mừng đến với Hệ thống</h2>
                                    <p>Vui lòng chọn một chức năng từ menu bên trái để bắt đầu.</p>
                                </div>
                            `;
                            return;
                        }

                        const route =
                            moduleRoutes[module];

                        if (!route) return;

                        try {

                            /* FETCH HTML */

                            const response =
                                await fetch(route);

                            const html =
                                await response.text();

                            /* LOAD INTO CONTENT */

                            mainContent.innerHTML =
                                html;

                            /* RELOAD SCRIPTS */

                            const scripts =
                                mainContent.querySelectorAll('script');

                            scripts.forEach(oldScript => {

                                const newScript =
                                    document.createElement('script');

                                if (oldScript.src) {

                                    newScript.src =
                                        oldScript.src;

                                } else {

                                    newScript.textContent =
                                        oldScript.textContent;
                                }

                                document.body.appendChild(newScript);

                            });

                        } catch (err) {

                            console.error(
                                'Load module error:',
                                err
                            );

                            mainContent.innerHTML =
                                `
                                <div style="
                                    padding:20px;
                                    color:red;
                                    font-weight:500;
                                ">
                                    Không thể tải module.
                                </div>
                                `;
                        }
                    }
                );

            });

        })();

    </script>

</body>

</html>
