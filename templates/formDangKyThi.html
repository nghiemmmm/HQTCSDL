{% extends "base_dashboard.html" %}

{% block title %}Dang ky thi{% endblock %}
{% block page_kicker %}Lap lich thi{% endblock %}
{% block page_title %}Dang ky thi{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="/static/css/dangKyThi.css">
{% endblock %}

{% block content %}
<main class="wrap">
  <form id="examForm" class="exam-form" novalidate>
    <div class="form-grid">
      <label>Lop</label>
      <div>
        <select id="class" required>
          <option value="" disabled selected hidden>Chon lop</option>
        </select>
        <span id="classError" class="form-error hidden"></span>
      </div>

      <label>Mon</label>
      <div>
        <select id="subject" required>
          <option value="" disabled selected hidden>Chon mon</option>
        </select>
        <span id="subjectError" class="form-error hidden"></span>
      </div>

      <label>Trinh do</label>
      <div>
        <select id="level" required>
          <option value="" disabled selected hidden>Chon trinh do</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
        </select>
        <span id="levelError" class="form-error hidden"></span>
      </div>

      <label>Lan thi</label>
      <div>
        <select id="attempt" required>
          <option value="" disabled selected hidden>Chon lan thi</option>
          <option value="1">1</option>
          <option value="2">2</option>
        </select>
        <span id="attemptError" class="form-error hidden"></span>
      </div>

      <label>Ngay thi</label>
      <div>
        <input type="date" id="date">
        <span id="dateError" class="form-error hidden"></span>
      </div>

      <label>Thoi gian phut</label>
      <div>
        <input type="number" id="duration" min="5" max="60" placeholder="60">
        <span id="durationError" class="form-error hidden"></span>
      </div>

      <label>So cau</label>
      <div>
        <input type="number" id="questionCount" min="10" max="100" placeholder="40">
        <span id="questionCountError" class="form-error hidden"></span>
      </div>
    </div>

    <div class="toolbar">
      <button type="submit" class="btn btn-primary" data-permission="create_exam_registration">Ghi</button>
    </div>
  </form>
</main>
{% endblock %}

{% block page_js %}
<script src="/static/js/dangKyThi.js?v=2"></script>
{% endblock %}
