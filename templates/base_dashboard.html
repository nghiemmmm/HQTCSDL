<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} - Thi trac nghiem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/dashboard.css?v=5">
    {% block page_css %}{% endblock %}
</head>

<body>
    <div class="dashboard-shell">
        {% include 'sidebar.html' %}

        <div class="dashboard-main">
            <header class="dashboard-topbar">
                <div class="topbar-left">
                    <button type="button" class="icon-button sidebar-toggle" id="sidebarToggle" aria-label="Mo menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <div>
                        <h2 id="topbarTitle">{{ self.page_title() }}</h2>
                    </div>
                </div>

                <div class="topbar-right" id="authArea">
                    <a class="btn btn-outline" href="/user/login">Dang nhap</a>
                </div>
            </header>

            <main class="dashboard-content" id="mainContent">
                {% block page_heading %}{% endblock %}

                {% block content %}{% endblock %}
            </main>

            {% include 'footer.html' %}
        </div>
    </div>

    <div id="toastHost" class="toast-host" aria-live="polite" aria-atomic="true"></div>

    <script>
        window.__SERVER_USER__ = {% if user is defined and user %}{{ user | tojson }}{% else %}null{% endif %};
    </script>
    <script src="/static/js/dashboard.js?v=6"></script>
    {% block page_js %}{% endblock %}
</body>

</html>
