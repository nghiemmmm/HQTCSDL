{% extends "base_dashboard.html" %}

{% block title %}Mon hoc{% endblock %}
{% block page_kicker %}Quan ly dao tao{% endblock %}
{% block page_title %}Quản lý môn học{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="/static/css/monHoc.css?v=8">
{% endblock %}

{% block content %}
<main class="wrap">

  <!-- FORM -->
  <div class="form-grid" id="formGrid" style="display:none;">

    <label>Mã môn học</label>
    <input id="maMH" maxlength="5" placeholder="VD: CTDL">

    <label>Tên môn học</label>
    <input id="tenMH" maxlength="50" placeholder="VD: Cấu trúc dữ liệu">

  </div>

  <!-- ERROR -->
  <div id="errorText" style="
            color:#dc2626;
            font-weight:500;
            font-size:14px;
            margin-top:5px; margin-bottom:5px;
            text-align:center;
            
        "></div>

  

  <!-- ACTION BAR -->
  <div class="action-bar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 20px; ">
    <!-- SEARCH -->
  <div style="
            margin:0;
            display:flex;
            align-items:center;
            gap:10px;
        ">

    <label style="
                font-weight:600;
                color:#6b7280;
                font-size:13px;
            ">
      Tìm nhanh theo tên:
    </label>

    <input id="searchTenMH" placeholder="Nhập tên môn học để lọc..." style="width: 250px;">

  </div>

    <!-- BUTTON -->
  <div class="toolbar" style="margin: 0;">

    <button id="btnThem" onclick="them()" data-permission="create_subject">
      Thêm
    </button>

    <button id="btnSua" onclick="sua()" data-permission="update_subject">
      Sửa
    </button>

    <button id="btnXoa" onclick="xoa()" data-permission="delete_subject">
      Xóa
    </button>

    <button id="btnGhi" onclick="ghi()" data-any-permission="create_subject,update_subject" style="display:none;">
      Ghi
    </button>

    <button id="btnHuy" onclick="huy()" data-any-permission="create_subject,update_subject" style="display:none;">
      Hủy
    </button>

    <button id="btnUndo" onclick="undo()" data-any-permission="create_subject,update_subject,delete_subject">
      Undo
    </button>

  </div>

  </div>
<!-- TABLE -->
  <table border="1">

    <thead>
      <tr>
        <th>Mã MH</th>
        <th>Tên MH</th>
      </tr>
    </thead>

    <tbody id="tbody"></tbody>

  </table>
  <div class="pagination-bar" id="monHocPagination"></div>

</main>

{% endblock %}

{% block page_js %}
<script src="/static/js/monHoc.js?v=23"></script>
{% endblock %}
