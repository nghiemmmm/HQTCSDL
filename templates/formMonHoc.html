<!-- templates/partials/monhoc.html -->

<link rel="stylesheet" href="/static/css/monHoc.css?v=3">

<main class="wrap">

  <h2>QUẢN LÝ MÔN HỌC</h2>

  <!-- FORM -->
  <div class="form-grid">

    <label>Mã môn học</label>
    <input id="maMH" maxlength="5" placeholder="VD: CTDL">

    <label>Tên môn học</label>
    <input id="tenMH" maxlength="50" placeholder="VD: Cấu trúc dữ liệu">

  </div>

  <!-- BUTTON -->
  <div class="toolbar">

    <button id="btnThem" onclick="them()">
      Thêm
    </button>

    <button id="btnSua" onclick="sua()">
      Sửa
    </button>

    <button id="btnXoa" onclick="xoa()">
      Xóa
    </button>

    <button id="btnGhi" onclick="ghi()" style="display:none;">
      Ghi
    </button>

    <button id="btnHuy" onclick="huy()" style="display:none;">
      Hủy
    </button>

    <button id="btnUndo" onclick="undo()">
      Undo
    </button>

  </div>

  <!-- ERROR -->
  <div id="errorText" style="
            color:#dc2626;
            font-weight:500;
            font-size:14px;
            margin-top:10px;
            text-align:center;
            min-height:20px;
        "></div>

  <!-- STATE -->
  <div id="stateText"></div>

  <!-- SEARCH -->
  <div style="
            margin:15px 0;
            display:flex;
            align-items:center;
            gap:10px;
        ">

    <label style="
                font-weight:600;
                color:#6b7280;
                font-size:13px;
            ">
      Tìm nhanh theo tên:
    </label>

    <input id="searchTenMH" placeholder="Nhập tên môn học để lọc..." style="flex:1;">

  </div>

  <!-- TABLE -->
  <table border="1">

    <thead>
      <tr>
        <th>Mã MH</th>
        <th>Tên MH</th>
      </tr>
    </thead>

    <tbody id="tbody"></tbody>

  </table>

</main>



<!-- JS -->
<script src="/static/js/monHoc.js?v=3"></script>
