{% extends "base_dashboard.html" %}

{% block title %}Tai khoan{% endblock %}
{% block page_kicker %}Quan ly nguoi dung{% endblock %}
{% block page_title %}Tao tai khoan{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="/static/css/register.css">
{% endblock %}

{% block content %}
<main class="container">
    <form id="registerForm" novalidate>
        <div class="form-group">
            <label>Giao vien</label>
            <select id="gvSelect" required>
                <option value="" disabled selected hidden>Chon giao vien</option>
                {% for gv in giang_viens %}
                <option value="{{ gv.magv }}" data-hoten="{{ gv.hoten }}" data-trangthai="{{ gv.trangthai }}">
                    {{ gv.hoten }}
                </option>
                {% endfor %}
            </select>

            <label style="width: 80px; margin-left: 10px;">Ma NV</label>
            <input type="text" id="manvInput" readonly>
        </div>

        <div class="form-group">
            <label>Tai khoan</label>
            <input type="text" id="username" placeholder="Tu dong theo ma nhan vien">
        </div>

        <div class="form-group">
            <label>Mat khau</label>
            <input type="password" id="password">
        </div>

        <div class="form-group">
            <label>Nhom quyen</label>
            <select id="role" required>
                <option value="" disabled selected hidden>Chon nhom quyen</option>
                <option value="GIANGVIEN">Giang vien</option>
                <option value="PGV">PGV</option>
            </select>
        </div>

        <p id="error-message" style="color:red;"></p>

        <div class="buttons">
            <button type="submit">Tao tai khoan</button>
            <button type="button" id="btnClearForm">Xoa</button>
            <a class="btn btn-outline" href="/home">Thoat</a>
        </div>
    </form>
</main>
{% endblock %}

{% block page_js %}
<script>
    const gvSelect = document.getElementById("gvSelect");
    const manvInput = document.getElementById("manvInput");
    const btnSubmit = document.querySelector('button[type="submit"]');
    const inputUsername = document.getElementById("username");
    const inputPassword = document.getElementById("password");
    const selectRole = document.getElementById("role");
    const errorMsg = document.getElementById("error-message");

    gvSelect.addEventListener("change", function () {
        const selectedOption = this.options[this.selectedIndex];

        if (this.value) {
            manvInput.value = this.value;
            inputUsername.value = this.value;

            const trangthai = selectedOption.dataset.trangthai;
            const disabled = trangthai == "1";
            btnSubmit.style.display = disabled ? "none" : "";
            inputUsername.disabled = disabled;
            inputPassword.disabled = disabled;
            selectRole.disabled = disabled;
        } else {
            manvInput.value = "";
            inputUsername.value = "";
            btnSubmit.style.display = "";
            inputUsername.disabled = false;
            inputPassword.disabled = false;
            selectRole.disabled = false;
        }
    });

    document.getElementById('registerForm').addEventListener('submit', function (e) {
        e.preventDefault();
        errorMsg.innerText = "";

        const password = inputPassword.value;
        const manv = manvInput.value;
        const role = selectRole.value;
        const username = inputUsername.value || manv;

        if (!manv) {
            errorMsg.innerText = "Vui long chon giao vien";
            return;
        }

        if (!password) {
            errorMsg.innerText = "Vui long nhap mat khau";
            return;
        }

        if (!role) {
            errorMsg.innerText = "Vui long chon nhom quyen";
            return;
        }

        fetch('/user/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                loginname: manv,
                password: password,
                username: username,
                role: role
            })
        })
            .then(res => {
                if (!res.ok) {
                    return res.json().then(data => {
                        throw new Error(data.detail || "Tao tai khoan that bai");
                    });
                }
                return res.json();
            })
            .then(data => {
                window.notify?.(data.message || "Tao tai khoan thanh cong", "success");
                document.getElementById('registerForm').reset();
                manvInput.value = "";
            })
            .catch(err => {
                errorMsg.innerText = err.message;
                window.notify?.(err.message, "error");
            });
    });

    document.getElementById('btnClearForm').addEventListener('click', function () {
        document.getElementById('registerForm').reset();
        manvInput.value = "";
        errorMsg.innerText = "";
        btnSubmit.style.display = "";
        inputUsername.disabled = false;
        inputPassword.disabled = false;
        selectRole.disabled = false;
    });
</script>
{% endblock %}
