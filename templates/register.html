{% extends "base_dashboard.html" %}

{% block title %}Tai khoan{% endblock %}
{% block page_kicker %}Quan ly nguoi dung{% endblock %}
{% block page_title %}Tao tai khoan{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="/static/css/register.css">
{% endblock %}

{% block content %}
<main class="container">
    <form id="registerForm" novalidate>
        <div class="form-group">
            <label>Ho va ten nhan vien</label>
            <select id="employeeName">
                <option value="">-- Chon nhan vien --</option>
                {% for gv in giang_viens %}
                <option value="{{ gv.hoten }}"
                    data-magv="{{ gv.magv }}"
                    data-trangthai="{{ gv.trangthai }}"
                    data-loginname="{{ gv.loginname }}"
                    data-role="{{ gv.role }}">{{ gv.hoten }}</option>
                {% endfor %}
            </select>

            <label style="width: 80px; margin-left: 10px;">Ma NV</label>
            <input type="text" id="manvInput" readonly>
        </div>

        <div class="form-group">
            <label>Tai khoan</label>
            <input type="text" id="username" placeholder="Tu dong theo ma nhan vien">
        </div>

        <div class="form-group">
            <label>Mat khau</label>
            <input type="password" id="password">
        </div>

        <div class="form-group">
            <label>Nhom quyen</label>
            <select id="role" required>
                <option value="" disabled selected hidden>Chon nhom quyen</option>
                <option value="GIANGVIEN">Giang vien</option>
                <option value="PGV">PGV</option>
            </select>
        </div>

        <p id="error-message" style="color:red;"></p>

        <div class="buttons">
            <button type="submit">Tao tai khoan</button>
            <button type="button" id="btnClearForm">Xoa</button>
            <a class="btn btn-outline" href="/home">Thoat</a>
        </div>
    </form>
</main>
{% endblock %}

{% block page_js %}
<script>
    const employeeSelect = document.getElementById("employeeName");
    const manvInput      = document.getElementById("manvInput");
    const btnSubmit      = document.querySelector('button[type="submit"]');
    const inputUsername  = document.getElementById("username");
    const inputPassword  = document.getElementById("password");
    const selectRole     = document.getElementById("role");
    const errorMsg       = document.getElementById("error-message");
    let selectedHasAccount = false;

    /* Áp dụng thông tin nhân viên vào các ô */
    function applyEmployee(opt) {
        const magv       = opt.dataset.magv || "";
        const hasAccount = opt.dataset.trangthai == "1";
        selectedHasAccount = hasAccount;

        manvInput.value = magv;
        if (hasAccount) {
            inputUsername.value  = opt.dataset.loginname || magv;
            selectRole.value     = opt.dataset.role || "";
        } else {
            inputUsername.value  = magv;
            selectRole.value     = "";
        }
        inputUsername.disabled = hasAccount;
        inputPassword.disabled = hasAccount;
        selectRole.disabled    = hasAccount;
        btnSubmit.style.display = hasAccount ? "none" : "";
        errorMsg.innerText = hasAccount
            ? "Nhan vien nay da co quyen/tai khoan. Chi duoc xoa thong tin dang chon, khong tao moi."
            : "";
    }

    /* Xóa toàn bộ ô khi không chọn nhân viên */
    function clearFields() {
        selectedHasAccount     = false;
        manvInput.value        = "";
        inputUsername.value    = "";
        inputPassword.value    = "";
        selectRole.value       = "";
        inputUsername.disabled = false;
        inputPassword.disabled = false;
        selectRole.disabled    = false;
        btnSubmit.style.display = "";
        errorMsg.innerText     = "";
    }

    /* Khi chọn nhân viên từ dropdown */
    employeeSelect.addEventListener("change", function () {
        const opt = this.options[this.selectedIndex];
        if (!opt || !opt.value) {
            clearFields();
        } else {
            applyEmployee(opt);
        }
    });

    /* Submit tạo tài khoản */
    document.getElementById("registerForm").addEventListener("submit", function (e) {
        e.preventDefault();
        errorMsg.innerText = "";

        const hoten    = employeeSelect.options[employeeSelect.selectedIndex]?.text?.trim() || "";
        const manv     = manvInput.value.trim();
        const username = inputUsername.value.trim();
        const password = inputPassword.value;
        const role     = selectRole.value;

        if (!hoten || !manv)    { errorMsg.innerText = "Vui long chon nhan vien"; return; }
        if (!username)          { errorMsg.innerText = "Vui long nhap tai khoan"; return; }
        if (!password)          { errorMsg.innerText = "Vui long nhap mat khau"; return; }
        if (!role)              { errorMsg.innerText = "Vui long chon nhom quyen"; return; }

        fetch("/user/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ loginname: username, password, username: manv, role, hoten })
        })
        .then(res => {
            if (!res.ok) return res.json().then(d => { throw new Error(d.detail?.message || d.detail || "Tao tai khoan that bai"); });
            return res.json();
        })
        .then(data => {
            window.notify?.(data.message || "Tao tai khoan thanh cong", "success");
            document.getElementById("registerForm").reset();
            clearFields();
        })
        .catch(err => { errorMsg.innerText = err.message; window.notify?.(err.message, "error"); });
    });

    /* Nút Xóa (xóa tài khoản hoặc reset form) */
    document.getElementById("btnClearForm").addEventListener("click", async function () {
        if (selectedHasAccount) {
            const loginname = inputUsername.value.trim();
            if (!loginname) { errorMsg.innerText = "Khong xac dinh duoc login can xoa"; return; }
            if (!confirm(`Xoa tai khoan login ${loginname}?`)) return;
            try {
                const res  = await fetch(`/user/register/${encodeURIComponent(loginname)}`, { method: "DELETE" });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.detail?.message || data.detail || "Xoa tai khoan that bai");
                window.notify?.(data.message || "Xoa tai khoan thanh cong", "success");
                // Cập nhật trangthai trong DOM để phản ánh đúng
                const opt = employeeSelect.options[employeeSelect.selectedIndex];
                if (opt) opt.dataset.trangthai = "0";
            } catch (err) {
                errorMsg.innerText = err.message;
                window.notify?.(err.message, "error");
                return;
            }
        }
        document.getElementById("registerForm").reset();
        clearFields();
    });
</script>
{% endblock %}
